# 1980TA
# BalrogOS boot configuration
# the loader passes these to the kernel, nothing here is guessed.
#
# the first line is the magic, BOOT_CONFIG_MAGIC in
# include/balrog_os/boot/boot_config.h. The loader refuses a file that does not
# start with it, so this esp cannot be confused with another system's.
#
# root_guid is the unique guid of the gpt partition holding the root, the one
# sfdisk prints and write_to_usb.sh draws at every flash. All zeroes here means
# no root is configured : the kernel falls back on the ramdisk, which is what
# the qemu esp wants since it has no gpt at all.
#
# no quotes, no sections, no space around the '=' : the loader has no allocator
# and no way to say it did not understand.
root_guid=00000000-0000-0000-0000-000000000000
